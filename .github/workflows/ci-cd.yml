name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medflow_ci
      NEXTAUTH_SECRET: ci-build-secret-32-chars-minimum-x
      NEXTAUTH_URL: http://localhost:3000
      MOCK_MODE: "true"
      MEDFLOW_WEBHOOK_ALLOW_UNAUTHENTICATED: "true"
      SESSION_MAX_AGE_SECONDS: "1800"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
